name: Critical Error - opublikuj Worker

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-error-worker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Zbuduj stronę i Workera
        run: npm run build
      - name: Sprawdź konfigurację wdrożenia
        id: config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_APPLICATION_WEBHOOK: ${{ secrets.DISCORD_APPLICATION_WEBHOOK }}
          WOWAUDIT_API_KEY: ${{ secrets.WOWAUDIT_API_KEY }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$WOWAUDIT_API_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$DISCORD_APPLICATION_WEBHOOK" ]; then
            echo 'discord=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Konfiguracja Cloudflare jest jeszcze potrzebna
        if: steps.config.outputs.ready != 'true'
        run: echo 'Dodaj CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN i WOWAUDIT_API_KEY, potem uruchom ponownie workflow.'
      - name: Opublikuj Worker ze zgłoszeniami Discord
        if: steps.config.outputs.ready == 'true' && steps.config.outputs.discord == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
          secrets: |
            DISCORD_APPLICATION_WEBHOOK
            WOWAUDIT_API_KEY
        env:
          DISCORD_APPLICATION_WEBHOOK: ${{ secrets.DISCORD_APPLICATION_WEBHOOK }}
          WOWAUDIT_API_KEY: ${{ secrets.WOWAUDIT_API_KEY }}
      - name: Opublikuj Worker z rosterem
        if: steps.config.outputs.ready == 'true' && steps.config.outputs.discord != 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
          secrets: |
            WOWAUDIT_API_KEY
        env:
          WOWAUDIT_API_KEY: ${{ secrets.WOWAUDIT_API_KEY }}
